<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw from the Hat 🎩</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCiwx_I8q0Xm2OanL3iXf_a4THzjGLig2c",
    authDomain: "hat-draw-15118.firebaseapp.com",
    databaseURL: "https://hat-draw-15118-default-rtdb.firebaseio.com",
    projectId: "hat-draw-15118",
    storageBucket: "hat-draw-15118.firebasestorage.app",
    messagingSenderId: "467057463056",
    appId: "1:467057463056:web:63cc337d0bfdbb00e81f95"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getDatabase(firebaseApp);

  const uid = () => Math.random().toString(36).slice(2, 9);

  const shuffle = arr => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  function drawFromHat(submissions) {
    const ids = Object.keys(submissions);
    let assignments, attempts = 0;
    do {
      assignments = shuffle([...ids]);
      attempts++;
    } while (attempts < 200 && assignments.some((id, i) => id === ids[i]));
    const result = {};
    ids.forEach((id, i) => { result[id] = submissions[assignments[i]]; });
    return result;
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const state = {
    screen: 'home',
    userId: uid(),
    role: 'participant',
    roomCode: null,
    room: null,
    myAnswer: '',
    submitted: false,
    questionDraft: '',
    joinCode: '',
  };

  let roomListener = null;

  function roomRef(code) { return ref(db, 'rooms/' + code); }

  function getShareLink(code) {
    return window.location.origin + window.location.pathname + '?room=' + code;
  }

  async function createRoomInDB(code) {
    await set(roomRef(code), {
      phase: 'waiting',
      question: '',
      submissions: {},
      assignments: {},
      participants: { [state.userId]: 'Facilitator' }
    });
  }

  async function joinRoomInDB(code) {
    const snap = await get(roomRef(code));
    if (!snap.exists()) return false;
    await update(ref(db, 'rooms/' + code + '/participants'), { [state.userId]: 'Participant' });
    return true;
  }

  function listenToRoom(code) {
    if (roomListener) roomListener();
    roomListener = onValue(roomRef(code), snap => {
      if (!snap.exists()) return;
      const data = snap.val();
      const prevPhase = state.room?.phase;
      state.room = data;
      if (prevPhase !== 'waiting' && data.phase === 'waiting') {
        state.submitted = false;
        state.myAnswer = '';
      }
      const focused = document.activeElement;
      const isTyping = focused && (focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA');
      if (isTyping) {
        updateStatusOnly();
      } else {
        render();
      }
    });
  }

  function updateStatusOnly() {
    const room = state.room;
    if (!room) return;
    const pc = Object.keys(room.participants || {}).length;
    const sc = Object.keys(room.submissions || {}).length;
    const statEl = document.querySelector('.stat');
    if (statEl) statEl.textContent = `Participants in room: ${pc}`;
    const pt = document.querySelector('.progress-text');
    if (pt) pt.textContent = `${sc} of ${pc} answered`;
    const pb = document.querySelector('.progress-bar');
    if (pb) pb.style.width = pc > 0 ? Math.min(100, sc/pc*100)+'%' : '0%';
    if (room.phase === 'reveal') render();
  }

  async function createRoom() {
    const code = Math.random().toString(36).slice(2, 7).toUpperCase();
    await createRoomInDB(code);
    state.roomCode = code;
    state.role = 'facilitator';
    state.screen = 'facilitator';
    listenToRoom(code);
    render();
  }

  async function joinRoom(code) {
    code = (code || state.joinCode).trim().toUpperCase();
    if (!code) return;
    const ok = await joinRoomInDB(code);
    if (!ok) { alert('Room not found. Check the link and try again.'); return; }
    state.roomCode = code;
    state.role = 'participant';
    state.screen = 'participant';
    listenToRoom(code);
    render();
  }

  async function openQuestion() {
    const q = state.questionDraft.trim();
    if (!q) return;
    await set(roomRef(state.roomCode), {
      ...state.room,
      phase: 'open',
      question: q,
      submissions: {},
      assignments: {}
    });
    state.questionDraft = '';
    state.myAnswer = '';
    state.submitted = false;
  }

  async function closeAndDraw() {
    const subs = state.room.submissions || {};
    const ids = Object.keys(subs);
    if (ids.length < 2) { alert('Need at least 2 answers to draw from the hat.'); return; }
    const assignments = drawFromHat(subs);
    await update(roomRef(state.roomCode), { phase: 'reveal', assignments });
  }

  async function nextQuestion() {
    await set(roomRef(state.roomCode), {
      ...state.room,
      phase: 'waiting',
      question: '',
      submissions: {},
      assignments: {}
    });
    state.myAnswer = '';
    state.submitted = false;
  }

  async function submitAnswer() {
    const ans = state.myAnswer.trim();
    if (!ans) return;
    await update(ref(db, 'rooms/' + state.roomCode + '/submissions'), { [state.userId]: ans });
    state.submitted = true;
    render();
  }

  function copyLink() {
    const link = getShareLink(state.roomCode);
    navigator.clipboard.writeText(link).then(() => {
      const btn = document.getElementById('copyBtn');
      if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy Link'; }, 2000); }
    });
  }

  function render() {
    const app = document.getElementById('app');
    if (state.screen === 'home')        { app.innerHTML = renderHome();        bindHome();        return; }
    if (state.screen === 'facilitator') { app.innerHTML = renderFacilitator(); bindFacilitator(); return; }
    if (state.screen === 'participant') { app.innerHTML = renderParticipant(); bindParticipant(); return; }
  }

  function renderHome() {
    return `
      <div class="center">
        <div class="hat-icon">🎩</div>
        <h1>Draw from the Hat</h1>
        <p class="subtitle">Anonymous answers, randomly assigned.<br>Everyone shares — no one's exposed.</p>
        <div class="divider"></div>
        <div class="section">
          <span class="label">Lead a Session</span>
          <button class="btn-primary" id="createBtn">Create New Room</button>
        </div>
      </div>`;
  }

  function bindHome() {
    document.getElementById('createBtn').addEventListener('click', createRoom);
  }

  function renderAnswerArea() {
    if (state.submitted) {
      return `<div class="status-box">Your answer is in the hat. Waiting for others...</div>`;
    }
    return `
      <div class="answer-section">
        <span class="label">Your Answer</span>
        <textarea id="answerInput" rows="3" placeholder="Type your answer here...">${esc(state.myAnswer)}</textarea>
        <button class="btn-primary" id="submitBtn">Put it in the Hat 🎩</button>
      </div>`;
  }

  function bindAnswerArea() {
    const ai = document.getElementById('answerInput');
    if (ai) {
      ai.addEventListener('input', e => state.myAnswer = e.target.value);
      document.getElementById('submitBtn').addEventListener('click', submitAnswer);
    }
  }

  function renderFacilitator() {
    const room = state.room;
    if (!room) return '<p>Loading...</p>';
    const pc = Object.keys(room.participants || {}).length;
    const sc = Object.keys(room.submissions || {}).length;
    const pct = pc > 0 ? Math.min(100, (sc / pc) * 100) : 0;
    const myDrawn = room.assignments?.[state.userId];
    const shareLink = getShareLink(state.roomCode);
    let body = '';

    const sharebox = `
      <div class="share-box">
        <span class="label">Share this link in Zoom chat</span>
        <div class="share-link">${esc(shareLink)}</div>
        <button class="btn-copy" id="copyBtn">Copy Link</button>
      </div>`;

    if (room.phase === 'waiting') {
      body = `
        <div class="section">
          ${sharebox}
          <div class="divider"></div>
          <span class="label">Ask a Question</span>
          <textarea id="qDraft" rows="3" placeholder="Type your question here...">${esc(state.questionDraft)}</textarea>
          <button class="btn-primary" id="openBtn">Open Question to Everyone</button>
        </div>`;
    }

    if (room.phase === 'open') {
      body = `
        <div class="section">
          <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
          ${renderAnswerArea()}
          <div class="ctrl-divider"></div>
          <span class="ctrl-label">FACILITATOR CONTROLS</span>
          <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
          <p class="progress-text">${sc} of ${pc} answered</p>
          <button class="btn-danger" id="closeBtn">Close &amp; Draw from Hat</button>
          <p class="hint">Close early if someone left without answering.</p>
        </div>`;
    }

    if (room.phase === 'reveal') {
      const mySlip = myDrawn
        ? `<span class="label">You Drew...</span><div class="drawn-answer">🎩 ${esc(myDrawn)}</div>`
        : `<div class="status-box">You did not submit an answer so you were not assigned one.</div>`;
      body = `
        <div class="section">
          <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
          ${mySlip}
          <div class="ctrl-divider"></div>
          <span class="ctrl-label">FACILITATOR CONTROLS</span>
          <button class="btn-primary" id="nextBtn">Next Question</button>
        </div>`;
    }

    return `
      <div class="top-bar">
        <span class="role-tag">FACILITATOR</span>
        <span class="code-tag">Room: <strong>${state.roomCode}</strong></span>
      </div>
      <div class="stat">Participants in room: ${pc}</div>
      ${body}`;
  }

  function bindFacilitator() {
    const copyBtn = document.getElementById('copyBtn');
    if (copyBtn) copyBtn.addEventListener('click', copyLink);
    const qd = document.getElementById('qDraft');
    if (qd) {
      qd.addEventListener('input', e => state.questionDraft = e.target.value);
      document.getElementById('openBtn').addEventListener('click', openQuestion);
    }
    bindAnswerArea();
    const cb = document.getElementById('closeBtn');
    if (cb) cb.addEventListener('click', closeAndDraw);
    const nb = document.getElementById('nextBtn');
    if (nb) nb.addEventListener('click', nextQuestion);
  }

  function renderParticipant() {
    const room = state.room;
    if (!room) return '<p>Loading...</p>';
    const myDrawn = room.assignments?.[state.userId];
    let body = '';

    if (room.phase === 'waiting') {
      body = `<div class="center">
        <div style="font-size:56px;margin-bottom:14px">⏳</div>
        <p class="waiting-msg">You are in the room.<br>Waiting for the facilitator to ask a question...</p>
      </div>`;
    }

    if (room.phase === 'open') {
      body = `
        <div class="section">
          <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
          ${renderAnswerArea()}
        </div>`;
    }

    if (room.phase === 'reveal') {
      body = myDrawn
        ? `<div class="section">
             <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
             <span class="label">You Drew...</span>
             <div class="drawn-answer">🎩 ${esc(myDrawn)}</div>
             <p class="hint">Someone in the room wrote this. Read it aloud when it is your turn.</p>
           </div>`
        : `<div class="section">
             <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
             <div class="status-box">No answer was assigned to you. You may not have submitted in time.</div>
           </div>`;
    }

    return `
      <div class="top-bar">
        <span class="role-tag participant">PARTICIPANT</span>
        <span class="code-tag">Room: <strong>${state.roomCode}</strong></span>
      </div>
      ${body}`;
  }

  function bindParticipant() {
    bindAnswerArea();
  }

  // Check URL for room code on load
  function boot() {
    const params = new URLSearchParams(window.location.search);
    const roomCode = params.get('room');
    if (roomCode) {
      joinRoom(roomCode.toUpperCase());
    } else {
      render();
    }
  }

  boot();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #f0f0ec; display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; font-family: Georgia, serif; color: #1a1a1a; }
  #app { background: #ffffff; border: 1px solid #cccccc; border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 560px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .center { text-align: center; }
  .hat-icon { font-size: 64px; margin-bottom: 10px; }
  h1 { font-size: 32px; margin-bottom: 10px; color: #1a1a1a; }
  .subtitle { font-size: 17px; color: #555; margin-bottom: 24px; line-height: 1.6; }
  .divider { border-top: 2px solid #e0e0e0; margin: 24px 0; }
  .section { margin-bottom: 24px; }
  .label { font-size: 12px; letter-spacing: 2px; color: #777; margin-bottom: 10px; font-family: monospace; display: block; text-transform: uppercase; }
  textarea { width: 100%; padding: 14px 16px; background: #fff; border: 2px solid #ccc; border-radius: 8px; color: #1a1a1a; font-size: 18px; margin-bottom: 12px; font-family: Georgia, serif; resize: vertical; line-height: 1.6; }
  textarea:focus { outline: none; border-color: #2e6b3e; }
  button { width: 100%; padding: 15px; border: none; border-radius: 8px; color: #fff; font-size: 17px; cursor: pointer; font-family: Georgia, serif; margin-bottom: 8px; font-weight: bold; }
  .btn-primary { background: #2e6b3e; }
  .btn-primary:hover { background: #3a7a4a; }
  .btn-secondary { background: #fff; border: 2px solid #2e6b3e; color: #2e6b3e; font-weight: bold; }
  .btn-danger { background: #8b2e2e; }
  .btn-danger:hover { background: #a03535; }
  .btn-copy { background: #444; font-size: 14px; padding: 10px; margin-top: 8px; border-radius: 6px; }
  .btn-copy:hover { background: #222; }
  .share-box { background: #f8f8f4; border: 2px solid #ccc; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .share-link { font-family: monospace; font-size: 13px; color: #2e6b3e; word-break: break-all; margin: 8px 0 4px; line-height: 1.6; }
  .or-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 20px; }
  .or-line { flex: 1; height: 2px; background: #e0e0e0; }
  .or-text { color: #999; font-size: 14px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .role-tag { font-size: 12px; letter-spacing: 2px; background: #dce8ff; color: #2244aa; padding: 5px 12px; border-radius: 20px; font-family: monospace; }
  .role-tag.participant { background: #dcf0e4; color: #1a5c2e; }
  .code-tag { font-size: 15px; color: #444; font-family: monospace; letter-spacing: 1px; }
  .stat { font-size: 15px; color: #555; margin-bottom: 20px; }
  .question-box { background: #f8f8f4; border: 2px solid #ccc; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; font-size: 18px; line-height: 1.6; }
  .q-label { background: #2e6b3e; color: #fff; font-weight: bold; font-size: 13px; padding: 3px 10px; border-radius: 4px; flex-shrink: 0; margin-top: 3px; }
  .answer-section { background: #f0f8f2; border: 2px solid #2e6b3e; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  .answer-section .label { color: #2e6b3e; margin-bottom: 8px; }
  .progress-wrap { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar { height: 100%; background: #2e6b3e; border-radius: 4px; transition: width 0.5s; }
  .progress-text { font-size: 14px; color: #666; font-family: monospace; margin-bottom: 16px; }
  .hint { font-size: 14px; color: #888; margin-top: 8px; text-align: center; font-style: italic; }
  .status-box { background: #f0f8f2; border: 2px dashed #2e6b3e; border-radius: 8px; padding: 18px; font-size: 16px; color: #2e6b3e; text-align: center; font-family: monospace; margin-bottom: 12px; }
  .drawn-answer { background: #f0f8f2; border: 3px solid #2e6b3e; border-radius: 10px; padding: 22px 20px; font-size: 22px; font-style: italic; line-height: 1.6; margin-bottom: 12px; color: #1a1a1a; }
  .waiting-msg { color: #555; font-size: 18px; line-height: 1.8; margin-top: 16px; }
  .ctrl-divider { border-top: 2px dashed #e0e0e0; margin: 20px 0; }
  .ctrl-label { font-size: 12px; letter-spacing: 2px; color: #aaa; font-family: monospace; text-align: center; margin-bottom: 14px; display: block; }
</style>
</head>
<body>
<div id="app"></div>
</body>
</html>
