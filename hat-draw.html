<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw from the Hat 🎩</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #f0f0ec;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
    font-family: Georgia, serif;
    color: #1a1a1a;
  }
  #app {
    background: #ffffff;
    border: 1px solid #cccccc;
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .center { text-align: center; }
  .hat-icon { font-size: 64px; margin-bottom: 10px; }
  h1 { font-size: 32px; margin-bottom: 10px; color: #1a1a1a; letter-spacing: 0.5px; }
  .subtitle { font-size: 17px; color: #555; margin-bottom: 24px; line-height: 1.6; }
  .divider { border-top: 2px solid #e0e0e0; margin: 24px 0; }
  .section { margin-bottom: 24px; }
  .label {
    font-size: 12px; letter-spacing: 2px; color: #777;
    margin-bottom: 10px; font-family: monospace; display: block;
    text-transform: uppercase;
  }
  input[type="text"] {
    width: 100%; padding: 14px 16px;
    background: #fff; border: 2px solid #ccc;
    border-radius: 8px; color: #1a1a1a; font-size: 20px;
    margin-bottom: 12px; font-family: monospace;
    letter-spacing: 4px; text-align: center;
  }
  input[type="text"]:focus { outline: none; border-color: #2e6b3e; }
  textarea {
    width: 100%; padding: 14px 16px;
    background: #fff; border: 2px solid #ccc;
    border-radius: 8px; color: #1a1a1a; font-size: 18px;
    margin-bottom: 12px; font-family: Georgia, serif;
    resize: vertical; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: #2e6b3e; }
  button {
    width: 100%; padding: 15px; border: none; border-radius: 8px;
    color: #fff; font-size: 17px; cursor: pointer;
    font-family: Georgia, serif; margin-bottom: 8px; font-weight: bold;
  }
  .btn-primary { background: #2e6b3e; }
  .btn-primary:hover { background: #3a7a4a; }
  .btn-secondary { background: #fff; border: 2px solid #2e6b3e; color: #2e6b3e; font-weight: bold; }
  .btn-secondary:hover { background: #f0f8f2; }
  .btn-danger { background: #8b2e2e; }
  .btn-danger:hover { background: #a03535; }
  .or-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 20px; }
  .or-line { flex: 1; height: 2px; background: #e0e0e0; }
  .or-text { color: #999; font-size: 14px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .role-tag {
    font-size: 12px; letter-spacing: 2px; background: #dce8ff;
    color: #2244aa; padding: 5px 12px; border-radius: 20px; font-family: monospace;
  }
  .role-tag.participant { background: #dcf0e4; color: #1a5c2e; }
  .code-tag { font-size: 15px; color: #444; font-family: monospace; letter-spacing: 1px; }
  .stat { font-size: 15px; color: #555; margin-bottom: 20px; }
  .question-box {
    background: #f8f8f4; border: 2px solid #ccc; border-radius: 10px;
    padding: 16px 18px; margin-bottom: 16px;
    display: flex; gap: 12px; align-items: flex-start;
    font-size: 18px; line-height: 1.6;
  }
  .q-label {
    background: #2e6b3e; color: #fff; font-weight: bold;
    font-size: 13px; padding: 3px 10px; border-radius: 4px;
    flex-shrink: 0; margin-top: 3px;
  }
  .answer-section {
    background: #f0f8f2; border: 2px solid #2e6b3e;
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  .answer-section .label { color: #2e6b3e; margin-bottom: 8px; }
  .progress-wrap {
    height: 8px; background: #e0e0e0; border-radius: 4px;
    overflow: hidden; margin-bottom: 8px;
  }
  .progress-bar { height: 100%; background: #2e6b3e; border-radius: 4px; transition: width 0.5s; }
  .progress-text { font-size: 14px; color: #666; font-family: monospace; margin-bottom: 16px; }
  .hint { font-size: 14px; color: #888; margin-top: 8px; text-align: center; font-style: italic; }
  .answer-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .answer-item {
    background: #f8f8f4; border: 1px solid #ccc;
    border-radius: 8px; padding: 14px 18px; font-size: 17px; line-height: 1.5;
  }
  .status-box {
    background: #f0f8f2; border: 2px dashed #2e6b3e; border-radius: 8px;
    padding: 18px; font-size: 16px; color: #2e6b3e;
    text-align: center; font-family: monospace; margin-bottom: 12px;
  }
  .drawn-answer {
    background: #f0f8f2; border: 3px solid #2e6b3e; border-radius: 10px;
    padding: 22px 20px; font-size: 22px; font-style: italic;
    line-height: 1.6; margin-bottom: 12px; color: #1a1a1a;
  }
  .waiting-msg { color: #888; font-size: 17px; line-height: 1.7; font-style: italic; margin-top: 16px; }
  .ctrl-divider { border-top: 2px dashed #e0e0e0; margin: 20px 0; }
  .ctrl-label { font-size: 12px; letter-spacing: 2px; color: #aaa; font-family: monospace; text-align: center; margin-bottom: 14px; display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2, 9);

const shuffle = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

function drawFromHat(submissions) {
  const ids = submissions.map(s => s.id);
  let assignments, attempts = 0;
  do {
    assignments = shuffle(ids);
    attempts++;
  } while (attempts < 200 && assignments.some((id, i) => id === ids[i]));
  const result = {};
  ids.forEach((id, i) => {
    result[id] = submissions.find(s => s.id === assignments[i]).answer;
  });
  return result;
}

function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Storage ──────────────────────────────────────────────────────────────────
const PREFIX = 'hatdraw_';

function loadRoom(code) {
  try {
    const raw = localStorage.getItem(PREFIX + code);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveRoom(code, data) {
  localStorage.setItem(PREFIX + code, JSON.stringify(data));
}

function defaultRoom() {
  return { phase: 'waiting', question: '', submissions: {}, assignments: {}, participants: {} };
}

// ── App state ────────────────────────────────────────────────────────────────
const state = {
  screen: 'home',
  userId: uid(),
  role: 'participant',
  roomCode: null,
  room: null,
  myAnswer: '',
  submitted: false,
  questionDraft: '',
  joinCode: '',
  lastRoomJSON: null,
};

let pollInterval = null;

// ── Polling ──────────────────────────────────────────────────────────────────
function startPolling(code) {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(() => {
    const data = loadRoom(code);
    if (!data) return;
    const json = JSON.stringify(data);
    if (json === state.lastRoomJSON) return;
    state.lastRoomJSON = json;

    const prevPhase = state.room?.phase;
    state.room = data;

    if (prevPhase !== 'waiting' && data.phase === 'waiting') {
      state.submitted = false;
      state.myAnswer = '';
    }

    smartRender();
  }, 1000);
}

function smartRender() {
  const focused = document.activeElement;
  const isTyping = focused && (focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA');
  if (isTyping) {
    updateStatusOnly();
  } else {
    render();
  }
}

function updateStatusOnly() {
  const room = state.room;
  if (!room) return;
  // total participants includes facilitator now
  const pc = Object.keys(room.participants).length;
  const sc = Object.keys(room.submissions).length;
  const statEl = document.querySelector('.stat');
  if (statEl) statEl.textContent = `👥 ${pc} in room (including you)`;
  const pt = document.querySelector('.progress-text');
  if (pt) pt.textContent = `${sc} of ${pc} answered`;
  const pb = document.querySelector('.progress-bar');
  if (pb) pb.style.width = pc > 0 ? Math.min(100, sc/pc*100)+'%' : '0%';
  if (room.phase === 'reveal') render();
}

// ── Actions ──────────────────────────────────────────────────────────────────
function createRoom() {
  const code = Math.random().toString(36).slice(2, 7).toUpperCase();
  const room = defaultRoom();
  room.participants[state.userId] = 'Facilitator';
  saveRoom(code, room);
  state.roomCode = code;
  state.room = room;
  state.lastRoomJSON = JSON.stringify(room);
  state.role = 'facilitator';
  state.screen = 'facilitator';
  startPolling(code);
  render();
}

function joinRoom() {
  const code = state.joinCode.trim().toUpperCase();
  if (!code) return;
  const data = loadRoom(code);
  if (!data) { alert('Room not found. Check the code and try again.'); return; }
  data.participants[state.userId] = 'Participant';
  saveRoom(code, data);
  state.roomCode = code;
  state.room = data;
  state.lastRoomJSON = JSON.stringify(data);
  state.role = 'participant';
  state.screen = 'participant';
  startPolling(code);
  render();
}

function openQuestion() {
  const q = state.questionDraft.trim();
  if (!q) return;
  const data = loadRoom(state.roomCode);
  data.phase = 'open';
  data.question = q;
  data.submissions = {};
  data.assignments = {};
  saveRoom(state.roomCode, data);
  state.room = data;
  state.lastRoomJSON = JSON.stringify(data);
  state.questionDraft = '';
  state.myAnswer = '';
  state.submitted = false;
  render();
}

function closeAndDraw() {
  const data = loadRoom(state.roomCode);
  const subs = Object.entries(data.submissions).map(([id, answer]) => ({ id, answer }));
  if (subs.length < 2) { alert('Need at least 2 answers to draw from the hat.'); return; }
  data.assignments = drawFromHat(subs);
  data.phase = 'reveal';
  saveRoom(state.roomCode, data);
  state.room = data;
  state.lastRoomJSON = JSON.stringify(data);
  render();
}

function nextQuestion() {
  const data = loadRoom(state.roomCode);
  data.phase = 'waiting';
  data.question = '';
  data.submissions = {};
  data.assignments = {};
  saveRoom(state.roomCode, data);
  state.room = data;
  state.lastRoomJSON = JSON.stringify(data);
  state.myAnswer = '';
  state.submitted = false;
  render();
}

function submitAnswer() {
  const ans = state.myAnswer.trim();
  if (!ans) return;
  const data = loadRoom(state.roomCode);
  data.submissions[state.userId] = ans;
  saveRoom(state.roomCode, data);
  state.room = data;
  state.lastRoomJSON = JSON.stringify(data);
  state.submitted = true;
  render();
}

// ── HTML builders ────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'home')        { app.innerHTML = renderHome();        bindHome();        return; }
  if (state.screen === 'facilitator') { app.innerHTML = renderFacilitator(); bindFacilitator(); return; }
  if (state.screen === 'participant') { app.innerHTML = renderParticipant(); bindParticipant(); return; }
}

function renderHome() {
  return `
    <div class="center">
      <div class="hat-icon">🎩</div>
      <h1>Draw from the Hat</h1>
      <p class="subtitle">Anonymous answers, randomly assigned.<br>Everyone shares — no one's exposed.</p>
      <div class="divider"></div>
      <div class="section">
        <span class="label">Join a Session</span>
        <input type="text" id="joinInput" placeholder="ROOM CODE" maxlength="8" value="${esc(state.joinCode)}">
        <button class="btn-primary" id="joinBtn">Join Room</button>
      </div>
      <div class="or-row"><span class="or-line"></span><span class="or-text">or</span><span class="or-line"></span></div>
      <div class="section">
        <span class="label">Lead a Session</span>
        <button class="btn-secondary" id="createBtn">Create New Room</button>
      </div>
    </div>`;
}

function bindHome() {
  const ji = document.getElementById('joinInput');
  ji.addEventListener('input', e => { state.joinCode = e.target.value.toUpperCase(); e.target.value = state.joinCode; });
  ji.addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
  document.getElementById('joinBtn').addEventListener('click', joinRoom);
  document.getElementById('createBtn').addEventListener('click', createRoom);
}

function renderAnswerArea() {
  // Shared answer box used by both facilitator and participant views
  if (state.submitted) {
    return `<div class="status-box">✅ Your answer is in the hat — waiting for others…</div>`;
  }
  return `
    <div class="answer-section">
      <span class="label">Your Answer</span>
      <textarea id="answerInput" rows="3" placeholder="Type your answer here…">${esc(state.myAnswer)}</textarea>
      <button class="btn-primary" id="submitBtn">Put it in the Hat 🎩</button>
    </div>`;
}

function bindAnswerArea() {
  const ai = document.getElementById('answerInput');
  if (ai) {
    ai.addEventListener('input', e => state.myAnswer = e.target.value);
    document.getElementById('submitBtn').addEventListener('click', submitAnswer);
  }
}

function renderFacilitator() {
  const room = state.room;
  const pc = Object.keys(room.participants).length;
  const sc = Object.keys(room.submissions).length;
  const pct = pc > 0 ? Math.min(100, (sc / pc) * 100) : 0;
  const myDrawn = room.assignments?.[state.userId];

  let body = '';

  if (room.phase === 'waiting') {
    body = `
      <div class="section">
        <span class="label">Ask a Question</span>
        <textarea id="qDraft" rows="3" placeholder="Type your question here…">${esc(state.questionDraft)}</textarea>
        <button class="btn-primary" id="openBtn">Open Question to Everyone</button>
      </div>`;
  }

  if (room.phase === 'open') {
    body = `
      <div class="section">
        <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
        ${renderAnswerArea()}
        <div class="ctrl-divider"></div>
        <span class="ctrl-label">FACILITATOR CONTROLS</span>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
        <p class="progress-text">${sc} of ${pc} answered</p>
        <button class="btn-danger" id="closeBtn">Close &amp; Draw from Hat</button>
        <p class="hint">Close early if someone left without answering.</p>
      </div>`;
  }

  if (room.phase === 'reveal') {
    const mySlip = myDrawn
      ? `<span class="label">You Drew…</span><div class="drawn-answer">🎩 ${esc(myDrawn)}</div>`
      : `<div class="status-box">⚠️ You didn't submit an answer so you weren't assigned one.</div>`;
    body = `
      <div class="section">
        <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
        ${mySlip}
        <div class="ctrl-divider"></div>
        <span class="ctrl-label">FACILITATOR CONTROLS</span>
        <button class="btn-primary" id="nextBtn">Next Question</button>
      </div>`;
  }

  return `
    <div class="top-bar">
      <span class="role-tag">FACILITATOR</span>
      <span class="code-tag">Room: <strong>${state.roomCode}</strong></span>
    </div>
    <div class="stat">👥 ${pc} in room (including you)</div>
    ${body}`;
}

function bindFacilitator() {
  const qd = document.getElementById('qDraft');
  if (qd) {
    qd.addEventListener('input', e => state.questionDraft = e.target.value);
    document.getElementById('openBtn').addEventListener('click', openQuestion);
  }
  bindAnswerArea();
  const cb = document.getElementById('closeBtn');
  if (cb) cb.addEventListener('click', closeAndDraw);
  const nb = document.getElementById('nextBtn');
  if (nb) nb.addEventListener('click', nextQuestion);
}

function renderParticipant() {
  const room = state.room;
  const myDrawn = room.assignments?.[state.userId];
  let body = '';

  if (room.phase === 'waiting') {
    body = `<div class="center">
      <div style="font-size:56px;margin-bottom:14px">⏳</div>
      <p class="waiting-msg">Waiting for the facilitator to ask a question…</p>
    </div>`;
  }

  if (room.phase === 'open') {
    body = `
      <div class="section">
        <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
        ${renderAnswerArea()}
      </div>`;
  }

  if (room.phase === 'reveal') {
    body = myDrawn
      ? `<div class="section">
           <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
           <span class="label">You Drew…</span>
           <div class="drawn-answer">🎩 ${esc(myDrawn)}</div>
           <p class="hint">Someone in the room wrote this. Read it aloud when it's your turn.</p>
         </div>`
      : `<div class="section">
           <div class="question-box"><span class="q-label">Q</span><span>${esc(room.question)}</span></div>
           <div class="status-box">⚠️ No answer assigned — you may not have submitted in time.</div>
         </div>`;
  }

  return `
    <div class="top-bar">
      <span class="role-tag participant">PARTICIPANT</span>
      <span class="code-tag">Room: <strong>${state.roomCode}</strong></span>
    </div>
    ${body}`;
}

function bindParticipant() {
  bindAnswerArea();
}

// Boot
render();
</script>
</body>
</html>
